<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marketplace Flip Scanner</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="mfs-popup">
      <header>
        <strong>Flip Scanner</strong>
        <span>Version 0.1</span>
      </header>

      <button id="mfs-show-panel" type="button">Show Panel</button>

      <label class="mfs-toggle">
        <input id="mfs-auto-open" type="checkbox">
        <span>
          <strong>Auto-open on Marketplace listings</strong>
          <small>Show the panel automatically when you open a Facebook Marketplace post.</small>
        </span>
      </label>

      <p id="mfs-popup-status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
